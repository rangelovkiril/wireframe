name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Daily rebuild, so the SOA serial and DNSKEY fetched at build time stay current.
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun check
      - run: bun test
      - run: bun run build
      - name: Validate the generated zone file
        run: |
          sudo apt-get install -y --no-install-recommends bind9-utils >/dev/null
          bun run check-zone

  build:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install, build and upload
        uses: withastro/action@v6
        with:
          path: ./src
          package-manager: bun@latest

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
